<script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // ป้องกันการ reload หน้าแบบปกติ

            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();

            // แสดง Progress Bar และปิดปุ่มกด
            progressContainer.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ กำลังประมวลผล...';

            // ดักจับ Event ตอนอัปโหลดไฟล์
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    
                    if (percent < 100) {
                        progressText.innerText = `กำลังอัปโหลดรูป... ${percent}%`;
                    } else {
                        // เมื่ออัปโหลดครบ 100% แล้ว ให้แจ้งว่ากำลังสร้าง PDF
                        progressText.innerText = `กำลังสร้าง PDF และส่งอีเมล... (อาจใช้เวลา 1-2 นาที)`;
                    }
                }
            });

            // เมื่อเซิร์ฟเวอร์ตอบกลับมา (สร้าง PDF เสร็จ)
            xhr.onload = function() {
                if (xhr.status === 200) {
                    // แปลงค่า JSON ที่ได้จากเซิร์ฟเวอร์
                    try {
                        const response = JSON.parse(xhr.responseText);
                        // ถ้ามี redirect_url ให้สั่งเบราว์เซอร์เปลี่ยนหน้าไป URL นั้น
                        if (response.redirect_url) {
                            window.location.href = response.redirect_url;
                        } else {
                            alert('เกิดข้อผิดพลาด: ไม่ได้รับ URL สำหรับเปลี่ยนหน้า');
                        }
                    } catch (err) {
                        alert('เกิดข้อผิดพลาดในการอ่านข้อมูลจากเซิร์ฟเวอร์');
                        console.error(err);
                    }
                } else {
                    // กรณีเซิร์ฟเวอร์พัง (เช่น Timeout)
                    alert('เกิดข้อผิดพลาดในการประมวลผล (Timeout หรือเซิร์ฟเวอร์หนืดเกินไป) กรุณาลองใหม่อีกครั้ง หรือลดจำนวนรูปลง');
                    submitBtn.disabled = false;
                    submitBtn.innerText = '⚡ สร้าง PDF Inspection';
                    progressContainer.style.display = 'none';
                }
            };

            // กรณีเชื่อมต่อไม่ได้
            xhr.onerror = function() {
                alert('การเชื่อมต่อล้มเหลว กรุณาตรวจสอบอินเทอร์เน็ต');
                submitBtn.disabled = false;
                submitBtn.innerText = '⚡ สร้าง PDF Inspection';
                progressContainer.style.display = 'none';
            };

            // ส่งข้อมูลแบบ POST ไปยัง URL ของฟอร์ม
            xhr.open('POST', form.action, true);
            xhr.send(formData);
        });
    </script>
