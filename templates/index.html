<!-- ตัวอย่างส่วนฟอร์มใน index.html -->
<form action="/create" method="POST" enctype="multipart/form-data">
    
    <!-- ช่องใส่ Size เดิม -->
    <label for="size">Size / ชื่อรายงาน:</label>
    <input type="text" id="size" name="size" placeholder="เช่น 8123" required>

    <br><br>

    <!-- ➕ เพิ่มช่องเลือก Result -->
    <label for="result">ผลการตรวจ (Result):</label>
    <select id="result" name="result" style="font-size: 16px; padding: 8px; border-radius: 6px;">
        <option value="RC OK">1. RC OK</option>
        <option value="RC NG">2. RC NG</option>
        <option value="Mold NG">3. Mold NG</option>
        <option value="Test">4. Test</option>
    </select>

    <br><br>

    <!-- ช่องอัปโหลดรูปภาพ -->
    <label for="photos">เลือกรูปภาพ:</label>
    <input type="file" id="photos" name="photos" multiple accept="image/*" required>

    <br><br>

    <button type="submit">สร้าง PDF และส่งอีเมล</button>
</form>
