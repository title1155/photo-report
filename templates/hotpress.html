<script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();

            progressContainer.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ กำลังประมวลผล...';

            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    
                    if (percent < 100) {
                        progressText.innerText = `กำลังอัปโหลดรูป... ${percent}%`;
                    } else {
                        progressText.innerText = `กำลังสร้าง PDF และประมวลผล...`;
                    }
                }
            });

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    if (response.redirect_url) {
                        window.location.href = response.redirect_url;
                    }
                } else {
                    alert('เกิดข้อผิดพลาดในการประมวลผล กรุณาลองใหม่อีกครั้ง');
                    submitBtn.disabled = false;
                    submitBtn.innerText = '⚡ สร้าง PDF Hot Press';
                    progressContainer.style.display = 'none';
                }
            };

            xhr.onerror = function() {
                alert('การเชื่อมต่อล้มเหลว กรุณาตรวจสอบอินเทอร์เน็ต');
                submitBtn.disabled = false;
                submitBtn.innerText = '⚡ สร้าง PDF Hot Press';
                progressContainer.style.display = 'none';
            };

            xhr.open('POST', form.action, true);
            xhr.send(formData);
        });
    </script>
